version: v2
modules:
  - path: src/contracts
lint:
  use:
    - STANDARD
  except:
    # Os contratos publicados usam camelCase e nomes de RPC que os consumidores já chamam.
    # Renomear quebraria os microsserviços, então essas regras ficam de fora por enquanto.
    - FIELD_LOWER_SNAKE_CASE
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX
    - RPC_PASCAL_CASE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
