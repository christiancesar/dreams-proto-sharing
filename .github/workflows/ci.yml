name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build e smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:smoke
      - name: Código gerado está em sincronia com os .proto
        run: |
          npx buf generate
          npm run build
          git diff --exit-code -- src/contracts esm
